# Reusable — Node.js Build + SAST + Container Security + ECR Push + Cosign Sign
#
# Called by the notification-service ci-notification.yml workflow.
# Pipeline stages (all in a single job, sequential):
#   1. npm ci + ESLint      — install dependencies + lint (--max-warnings 0)
#   2. npm test             — unit tests with Jest + coverage gate (≥ 80%)
#   3. SonarCloud    — SAST + code quality + coverage analysis
#   4. npm audit            — fail if any HIGH/CRITICAL vulnerabilities found
#   5. Docker build         — multi-stage, non-root UID/GID 1000
#   6. Trivy                — image scan, fail on HIGH/CRITICAL CVEs
#   7. ECR push             — tagged as sha-<7chars>
#   8. Cosign sign          — keyless, GitHub OIDC → Fulcio CA → Rekor transparency log
#
# Outputs: image-tag (sha-<7chars>), registry (ECR registry URL)

name: Reusable — Node.js Build & Security Gates

on:
  workflow_call:
    inputs:
      service-name:
        description: "Service name (e.g. notification-service)"
        required: true
        type: string
      service-dir:
        description: "Service directory relative to repo root"
        required: true
        type: string
      ecr-repository:
        description: "ECR repository name"
        required: true
        type: string
      node-version:
        description: "Node.js version to use"
        required: false
        type: string
        default: '22'
      aws-region:
        description: "AWS region where ECR lives"
        required: false
        type: string
        default: us-east-1
    outputs:
      image-tag:
        description: "Docker image tag pushed to ECR (format: sha-<7chars>)"
        value: ${{ jobs.build-and-push.outputs.image_tag }}
      registry:
        description: "ECR registry base URL"
        value: ${{ jobs.build-and-push.outputs.registry }}
    secrets:
      AWS_ACCOUNT_ID:
        required: true

jobs:
  build-and-push:
    name: Build · SAST · Scan · Push · Sign (${{ inputs.service-name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write        # OIDC — AWS + Cosign keyless
      contents: read         # Checkout
      security-events: write # SARIF upload
      issues: write          # Trivy findings issue
      actions: read
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      registry:  ${{ steps.login-ecr.outputs.registry }}

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # ── Derive short-SHA image tag ───────────────────────────────────────────
      - name: Set image tag
        id: meta
        run: echo "image_tag=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      # ── Node.js toolchain ────────────────────────────────────────────────────
      - name: Setup Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.service-dir }}/package-lock.json

      - name: Install dependencies
        run: cd ${{ inputs.service-dir }} && npm ci

      # ── Lint ──────────────────────────────────────────────────────────────────
      - name: ESLint (--max-warnings 0)
        run: cd ${{ inputs.service-dir }} && npx eslint src/ --ext .js,.ts --max-warnings 0


      - name: npm test (Jest + coverage gate ≥ 80%)
        run: cd ${{ inputs.service-dir }} && npm test -- --coverage --ci
        env:
          NODE_ENV: test

      - name: Upload Jest coverage report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-${{ inputs.service-name }}
          path: ${{ inputs.service-dir }}/coverage/
          retention-days: 7

      - name: SonarCloud Scan
        continue-on-error: true
        uses: SonarSource/sonarcloud-github-action@383f7e52eae3ab0510c3cb0e7d9d150bbaeab838 # v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: ${{ inputs.service-dir }}
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORG }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY_BACKEND }}
            -Dsonar.sources=src
            -Dsonar.tests=src
            -Dsonar.test.inclusions=**/*.test.js
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info


      - name: npm audit (HIGH/CRITICAL → warn)
        run: cd ${{ inputs.service-dir }} && npm audit --audit-level=high
        continue-on-error: true

      # ── AWS credentials via OIDC (no long-lived keys) ─────────────────────────
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/mackllc-dev-ecr-push-gha
          aws-region: ${{ inputs.aws-region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      # ── Docker build (multi-stage, non-root UID/GID 1000) ─────────────────────
      - name: Build Docker image
        id: docker-build
        run: |
          IMAGE="${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repository }}:${{ steps.meta.outputs.image_tag }}"
          cd ${{ inputs.service-dir }}
          docker build \
            --build-arg UID=1000 \
            --build-arg GID=1000 \
            -t "$IMAGE" \
            .
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      # ── Trivy — image scan (fail on HIGH/CRITICAL CVEs) ───────────────────────
      - name: Trivy — Image vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.docker-build.outputs.image }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: true

      # ── Route findings to a fixer (code scanning + one tracking issue per service)
      - name: "📤 Upload Trivy SARIF to code scanning"
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ inputs.service-name }}

      - name: "🐞 Open/update Trivy findings issue (${{ inputs.service-name }})"
        if: always() && hashFiles('trivy-results.sarif') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ${{ inputs.service-name }}: ${{ inputs.service-name }}
          IMAGE: ${{ steps.docker-build.outputs.image }}
        run: |
          COUNT=$(jq '[.runs[].results[]] | length' trivy-results.sarif)
          [ "$COUNT" -eq 0 ] && { echo "No findings"; exit 0; }
          LIST=$(jq -r '[.runs[].results[] | "- **\(.ruleId)**: \(.message.text | split("\n")[0:4] | join(" | "))"] | unique | .[:60][]' trivy-results.sarif)
          BODY=$(printf 'Trivy found **%s** fixable HIGH/CRITICAL findings in `%s` (image `%s`).\n\n%s\n\n**Fix:** bump the listed dependencies or the base image in the Dockerfile to the fixed versions, keep tests green, and open a PR. Re-run CI to confirm Trivy is clean.\n\nRun: %s/%s/actions/runs/%s' "$COUNT" "$${{ inputs.service-name }}" "$IMAGE" "$LIST" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          TITLE="Trivy: fixable HIGH/CRITICAL CVEs in $${{ inputs.service-name }}"
          gh label create security --color B60205 2>/dev/null || true
          N=$(gh issue list --state open --label security --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$N" ]; then gh issue edit "$N" --body "$BODY"; else gh issue create --title "$TITLE" --body "$BODY" --label security --assignee "copilot-swe-agent" || gh issue create --title "$TITLE" --body "$BODY" --label security; fi

      # ── Push image to ECR ─────────────────────────────────────────────────────
      - name: Push image to ECR
        id: push
        run: |
          IMAGE="${{ steps.docker-build.outputs.image }}"
          docker push "$IMAGE"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE" | awk -F@ '{print $2}')
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "Pushed: $IMAGE  (digest: $DIGEST)"

      # ── Cosign keyless sign ────────────────────────────────────────────────────
      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Cosign — Sign image (keyless, GitHub OIDC → Fulcio → Rekor)
        run: |
          cosign sign --yes \
            "${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repository }}@${{ steps.push.outputs.digest }}"
        env:
          COSIGN_EXPERIMENTAL: "true"
